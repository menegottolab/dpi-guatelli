<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheda DPI</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef3f8;
    margin:0;
    padding:20px;
}

.box{
    max-width:500px;
    margin:auto;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,.2);
}

.header{
    background:#0b74c9;
    color:white;
    padding:25px;
    text-align:center;
}

.header h1{
    margin:0;
}

.header p{
    margin:8px 0 0;
}

.content{
    padding:20px;
}

.riga{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.label{
    font-weight:bold;
    color:#4b5563;
}

.valore{
    text-align:right;
    font-weight:600;
}

.stato{
    margin-top:20px;
    padding:15px;
    text-align:center;
    font-weight:bold;
    font-size:18px;
    border-radius:8px;
}

.valido{
    background:#d4edda;
    color:#155724;
}

.in-scadenza{
    background:#fff3cd;
    color:#856404;
}

.scaduto{
    background:#f8d7da;
    color:#721c24;
}

.errore{
    color:#721c24;
    background:#f8d7da;
    text-align:center;
    font-weight:bold;
    padding:30px;
    border-radius:8px;
}

@media(max-width:480px){

    body{
        padding:10px;
    }

    .riga{
        flex-direction:column;
        gap:5px;
    }

    .valore{
        text-align:left;
    }
}

</style>

</head>

<body>

<div class="box">

<div class="header">
<h1>C.I.I. Guatelli S.p.A.</h1>
<p>Scheda DPI</p>
</div>

<div class="content" id="contenuto">
Caricamento...
</div>

</div>

<script>

const codice = new URLSearchParams(window.location.search).get("codice");

fetch("./dpi.json", { cache: "no-store" })
.then(response => {

    if(!response.ok){
        throw new Error("File dpi.json non disponibile");
    }

    return response.json();

})
.then(dati => {

    const x = dati[codice];

    if(!codice || !x){

        document.getElementById("contenuto").innerHTML =
        '<div class="errore">DPI NON TROVATO</div>';

        return;
    }

    const stato = (x.stato || "").toUpperCase();

    let classeStato = "valido";

    if(stato.includes("SCADUTO")){
        classeStato = "scaduto";
    }
    else if(stato.includes("SCADENZA")){
        classeStato = "in-scadenza";
    }

    document.getElementById("contenuto").innerHTML = `

    <div class="riga">
        <span class="label">Codice</span>
        <span class="valore">${x.codice || "-"}</span>
    </div>

    <div class="riga">
        <span class="label">DPI</span>
        <span class="valore">${x.dpi || "-"}</span>
    </div>

    <div class="riga">
        <span class="label">Lavoratore</span>
        <span class="valore">${x.lavoratore || "-"}</span>
    </div>

    <div class="riga">
        <span class="label">Marca</span>
        <span class="valore">${x.marca || "-"}</span>
    </div>

    <div class="riga">
        <span class="label">Data consegna</span>
        <span class="valore">${x.dataConsegna || "-"}</span>
    </div>

    <div class="riga">
        <span class="label">Scadenza</span>
        <span class="valore">${x.scadenza || "-"}</span>
    </div>

    <div class="stato ${classeStato}">
        ${x.stato || "STATO NON DISPONIBILE"}
    </div>

    `;

})
.catch(() => {

    document.getElementById("contenuto").innerHTML =
    '<div class="errore">Errore nel caricamento del file dpi.json</div>';

});

</script>

</body>
</html>
