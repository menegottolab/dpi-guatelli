<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheda DPI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:18px;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(180deg,#eef3f8 0%,#e5edf5 100%);
    color:#1f2937;
}

.scheda{
    max-width:520px;
    margin:0 auto;
    background:#ffffff;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 12px 35px rgba(15,23,42,.18);
}

.header{
    background:#0b74c9;
    padding:26px 22px;
    text-align:center;
}

.logo{
    width:255px;
    max-width:100%;
    height:auto;
    display:block;
    margin:0 auto;
}

.contenuto{
    padding:20px;
}

.riga{
    display:grid;
    grid-template-columns:44px 1fr auto;
    gap:12px;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid #e5e7eb;
}

.icona{
    width:36px;
    height:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eaf4fb;
    font-size:19px;
}

.label{
    font-size:14px;
    font-weight:700;
    color:#64748b;
    text-transform:uppercase;
    letter-spacing:.4px;
}

.valore{
    max-width:230px;
    text-align:right;
    font-size:16px;
    font-weight:700;
    color:#0f172a;
    word-break:break-word;
}

.stato{
    margin-top:22px;
    padding:17px 16px;
    border-radius:14px;
    text-align:center;
    font-size:20px;
    font-weight:800;
    letter-spacing:.5px;
    border:1px solid transparent;
}

.valido{
    background:#dcfce7;
    color:#166534;
    border-color:#86efac;
}

.in-scadenza{
    background:#fef3c7;
    color:#92400e;
    border-color:#fcd34d;
}

.scaduto{
    background:#fee2e2;
    color:#991b1b;
    border-color:#fca5a5;
}

.errore{
    padding:34px 20px;
    text-align:center;
    font-weight:800;
    color:#991b1b;
    background:#fee2e2;
    border-radius:14px;
}

.footer{
    max-width:520px;
    margin:12px auto 0;
    text-align:center;
    font-size:12px;
    color:#64748b;
}

@media(max-width:480px){
    body{
        padding:10px;
    }

    .header{
        padding:22px 16px;
    }

    .logo{
        width:210px;
    }

    .contenuto{
        padding:16px;
    }

    .riga{
        grid-template-columns:40px 1fr;
    }

    .valore{
        grid-column:2;
        max-width:none;
        text-align:left;
        margin-top:-5px;
    }
}
</style>
</head>

<body>

<div class="scheda">

    <div class="header">
        <img src="logo.png" class="logo" alt="Logo Guatelli">
    </div>

    <div class="contenuto" id="contenuto">
        Caricamento...
    </div>

</div>

<div class="footer">
    Scheda DPI consultabile tramite QR Code
</div>

<script>
const codice = new URLSearchParams(window.location.search).get("codice");
const contenuto = document.getElementById("contenuto");

function creaRiga(icona, etichetta, valore){
    return `
        <div class="riga">
            <div class="icona">${icona}</div>
            <div class="label">${etichetta}</div>
            <div class="valore">${valore || "-"}</div>
        </div>
    `;
}

fetch("./dpi.json", { cache: "no-store" })
.then(response => {
    if(!response.ok){
        throw new Error("File dpi.json non disponibile");
    }

    return response.json();
})
.then(dati => {
    const x = dati[codice];

    if(!codice || !x){
        contenuto.innerHTML =
            '<div class="errore">DPI NON TROVATO</div>';
        return;
    }

    const stato = (x.stato || "").toUpperCase();
    let classeStato = "valido";

    if(stato.includes("SCADUTO")){
        classeStato = "scaduto";
    }
    else if(stato.includes("SCADENZA")){
        classeStato = "in-scadenza";
    }

    contenuto.innerHTML = `
        ${creaRiga("🏷️", "Codice", x.codice)}
        ${creaRiga("🦺", "DPI", x.dpi)}
        ${creaRiga("👷", "Lavoratore", x.lavoratore)}
        ${creaRiga("🏭", "Marca", x.marca)}
        ${creaRiga("📅", "Data consegna", x.dataConsegna)}
        ${creaRiga("⏳", "Scadenza", x.scadenza)}

        <div class="stato ${classeStato}">
            ${x.stato || "STATO NON DISPONIBILE"}
        </div>
    `;
})
.catch(() => {
    contenuto.innerHTML =
        '<div class="errore">Errore nel caricamento del file dpi.json</div>';
});
</script>

</body>
</html>
