<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scheda DPI</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #1f2937;
    }

    .scheda {
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,.15);
    }

    .testata {
      padding: 24px;
      text-align: center;
      color: white;
      background: #0877c9;
    }

    .testata h1,
    .testata p {
      margin: 5px;
    }

    .codice {
      padding: 20px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      color: #0877c9;
    }

    .dati {
      padding: 0 20px 22px;
    }

    .riga {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid #ddd;
    }

    .titolo {
      font-weight: bold;
    }

    .valore {
      text-align: right;
    }

    .stato {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .valido {
      background: #dff4e5;
      color: #18733b;
    }

    .scaduto {
      background: #fde2e2;
      color: #b42318;
    }

    .errore {
      padding: 30px;
      text-align: center;
      color: #b42318;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="scheda">
  <div class="testata">
    <h1>C.I.I. Guatelli S.p.A.</h1>
    <p>Scheda identificativa DPI</p>
  </div>

  <div id="contenuto">
    <div class="errore">Caricamento...</div>
  </div>
</div>

<script>
  const codice = new URLSearchParams(location.search).get("codice");
  const contenuto = document.getElementById("contenuto");

  function riga(titolo, valore) {
    return `
      <div class="riga">
        <span class="titolo">${titolo}</span>
        <span class="valore">${valore || "-"}</span>
      </div>
    `;
  }

  fetch("./dpi.json")
    .then(r => r.json())
    .then(dati => {
      const dpi = dati[codice];

      if (!codice || !dpi) {
        contenuto.innerHTML =
          '<div class="errore">DPI non trovato.</div>';
        return;
      }

      let classe = "valido";

      if ((dpi.stato || "").toUpperCase().includes("SCADUTO")) {
        classe = "scaduto";
      }

      contenuto.innerHTML = `
        <div class="codice">${dpi.codice}</div>

        <div class="dati">
          ${riga("DPI", dpi.dpi)}
          ${riga("Lavoratore", dpi.lavoratore)}
          ${riga("Marca / Modello", dpi.marca)}
          ${riga("Data consegna", dpi.dataConsegna)}
          ${riga("Scadenza", dpi.scadenza)}

          <div class="stato ${classe}">
            ${dpi.stato}
          </div>
        </div>
      `;
    })
    .catch(() => {
      contenuto.innerHTML =
        '<div class="errore">Errore nel caricamento dei dati.</div>';
    });
</script>

</body>
</html>
